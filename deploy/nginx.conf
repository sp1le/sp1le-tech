# Reference server block for sp1le.tech.
#
# This is documentation, not a drop-in replacement: the live server already has
# TLS from certbot and a /voiceduel location for the Voice Duel game. Copy the
# pieces you need into the existing config rather than overwriting it.

server {
    listen 80;
    listen [::]:80;
    server_name sp1le.tech www.sp1le.tech;
    return 301 https://sp1le.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sp1le.tech www.sp1le.tech;

    # ssl_certificate / ssl_certificate_key are managed by certbot - leave as they are.

    root /var/www/portfolio;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 512;

    # Static multi-page site: serve the file, the directory index, or a real 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Content-hashed build output: safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep whatever locations already exist for other projects on this host,
    # for example:
    #
    # location /voiceduel/ {
    #     proxy_pass http://127.0.0.1:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }
}
